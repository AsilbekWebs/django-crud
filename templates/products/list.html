<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kitoblar Ro‘yxati</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            margin: 0;
            padding: 30px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeIn 0.8s ease-in-out;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
            text-align: center;
        }
        .card-content h3 {
            margin: 10px 0;
            color: #007BFF;
        }
        .card-content p {
            margin: 5px 0;
            color: #555;
        }
        .price {
            font-weight: bold;
            color: #28a745;
        }
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 14px;
            background: #007BFF;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
        }
        .btn:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: scale(0.95);}
            to {opacity: 1; transform: scale(1);}
        }
    </style>
    <script>
        function highlightCard(card) {
            card.style.backgroundColor = "#f1f9ff";
        }
        function resetCard(card) {
            card.style.backgroundColor = "#fff";
        }
    </script>
</head>
<body>
    <h2>📚 Kitoblar Ro‘yxati</h2>
    <div class="grid">
        {% for book in books %}
        <div class="card" onmouseover="highlightCard(this)" onmouseout="resetCard(this)">
            {% if book.photo %}
    <img src="{{ book.photo.url }}" alt="{{ book.name }}">
{% else %}
    <img src="/static/images/default.jpg" alt="Default image">
{% endif %}

            <div class="card-content">
                <h3>{{ book.name }}</h3>
                <p>Janr: {{ book.genre }}</p>
                <p class="price">{{ book.price }} so‘m</p>
                <a href="{% url 'book_detail' book.pk %}" class="btn">🔍 Tafsilot</a>
            </div>
        </div>
        {% empty %}
        <p style="text-align:center; color:#777;">❌ Hozircha kitoblar mavjud emas.</p>
        {% endfor %}
    </div>
</body>
</html>
